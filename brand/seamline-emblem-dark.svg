<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Seamline">
  <defs>
    <radialGradient id="sd-bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#14232d"/>
      <stop offset="100%" stop-color="#0b1218"/>
    </radialGradient>
    <radialGradient id="sd-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e6b6f" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#0e6b6f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0e6b6f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sd-disc" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#18303b"/>
      <stop offset="55%" stop-color="#102129"/>
      <stop offset="100%" stop-color="#091318"/>
    </radialGradient>
    <radialGradient id="sd-warm-glow" cx="34%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#ecbe62" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#dc8f72" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d9a543" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sd-cool-glow" cx="68%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#58bdb8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#0e6b6f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e6b6f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sd-modis" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc8f72"/>
      <stop offset="45%" stop-color="#d9a543"/>
      <stop offset="100%" stop-color="#ecbe62"/>
    </linearGradient>
    <linearGradient id="sd-viirs" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9fe5e0"/>
      <stop offset="45%" stop-color="#58bdb8"/>
      <stop offset="100%" stop-color="#2fa39e"/>
    </linearGradient>
    <linearGradient id="sd-orbit-front" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#58bdb8" stop-opacity="0.25"/>
      <stop offset="28%" stop-color="#91bfc3" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#ecbe62" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ecbe62" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sd-orbit-back" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#358581" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#527781" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#d9a543" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="sd-seam-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#91bfc3" stop-opacity="0"/>
      <stop offset="25%" stop-color="#91bfc3" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#faf9f6" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#58bdb8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58bdb8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sd-limb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58bdb8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#58bdb8" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="sd-globe-clip">
      <circle cx="256" cy="256" r="138"/>
    </clipPath>
    <clipPath id="sd-left-half">
      <rect x="118" y="118" width="138" height="276"/>
    </clipPath>
    <clipPath id="sd-right-half">
      <rect x="256" y="118" width="138" height="276"/>
    </clipPath>
    <pattern id="sd-grid-modis" width="23" height="23" patternUnits="userSpaceOnUse" x="118" y="118">
      <path d="M 23 0 L 0 0 0 23" fill="none" stroke="#ecbe62" stroke-width="0.8" stroke-opacity="0.13"/>
    </pattern>
    <pattern id="sd-grid-viirs" width="11.5" height="11.5" patternUnits="userSpaceOnUse" x="256" y="118">
      <path d="M 11.5 0 L 0 0 0 11.5" fill="none" stroke="#58bdb8" stroke-width="0.7" stroke-opacity="0.14"/>
    </pattern>
    <filter id="sd-softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sd-bg)"/>
  <circle cx="256" cy="256" r="215" fill="url(#sd-ambient)" opacity="0.55"/>

  <!-- Outer subtle aerospace calibration ring -->
  <circle cx="256" cy="256" r="151" fill="none" stroke="#4f8289" stroke-width="1.7" opacity="0.58"/>
  <g>
    <line x1="404.0" y1="256.0" x2="416.0" y2="256.0" stroke="#5b8b91" stroke-width="2.2" stroke-linecap="round" opacity="0.68"/>
    <line x1="385.9" y1="331.0" x2="391.1" y2="334.0" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
    <line x1="331.0" y1="385.9" x2="334.0" y2="391.1" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
    <line x1="256.0" y1="404.0" x2="256.0" y2="416.0" stroke="#5b8b91" stroke-width="2.2" stroke-linecap="round" opacity="0.68"/>
    <line x1="181.0" y1="385.9" x2="178.0" y2="391.1" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
    <line x1="108.0" y1="256.0" x2="96.0" y2="256.0" stroke="#5b8b91" stroke-width="2.2" stroke-linecap="round" opacity="0.68"/>
    <line x1="126.1" y1="181.0" x2="120.9" y2="178.0" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
    <line x1="181.0" y1="126.1" x2="178.0" y2="120.9" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
    <line x1="256.0" y1="108.0" x2="256.0" y2="96.0" stroke="#5b8b91" stroke-width="2.2" stroke-linecap="round" opacity="0.68"/>
    <line x1="331.0" y1="126.1" x2="334.0" y2="120.9" stroke="#5b8b91" stroke-width="1.4" stroke-linecap="round" opacity="0.42"/>
  </g>

  <!-- Back orbital ellipse arc (passes behind globe) -->
  <g transform="translate(256 256) rotate(-24)">
    <path d="M -202.0 0 A 202.0 60.0 0 0 1 202.0 0" fill="none" stroke="url(#sd-orbit-back)" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Main Earth aperture disc -->
  <circle cx="256" cy="256" r="139" fill="url(#sd-disc)" stroke="#58bdb8" stroke-opacity="0.38" stroke-width="2.4"/>

  <!-- Interior split resolution textures & curved atmospheric horizon -->
  <g clip-path="url(#sd-globe-clip)">
    <!-- Left hemisphere: MODIS 1 km coarse thermal heritage -->
    <g clip-path="url(#sd-left-half)">
      <rect x="118" y="118" width="138" height="276" fill="url(#sd-grid-modis)"/>
      <circle cx="256" cy="256" r="138" fill="url(#sd-warm-glow)"/>
    </g>
    <!-- Right hemisphere: VIIRS 375 m finer resolution -->
    <g clip-path="url(#sd-right-half)">
      <rect x="256" y="118" width="138" height="276" fill="url(#sd-grid-viirs)"/>
      <circle cx="256" cy="256" r="138" fill="url(#sd-cool-glow)"/>
    </g>

    <!-- Earth curvature / planetary limb band -->
    <path d="M 105 332 Q 256 382 407 332 L 407 410 L 105 410 Z" fill="url(#sd-limb)"/>
    <path d="M 114 316 Q 256 364 398 316" fill="none" stroke="#58bdb8" stroke-width="1.3" stroke-opacity="0.28"/>
    <path d="M 118 202 Q 256 164 394 202" fill="none" stroke="#91bfc3" stroke-width="1.1" stroke-opacity="0.16"/>

    <!-- Center vertical Harmonization Seamline axis -->
    <rect x="254.6" y="130" width="2.8" height="252" fill="url(#sd-seam-beam)"/>
    <line x1="256" y1="138" x2="256" y2="374" stroke="#eef5f4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4.5 7.5" opacity="0.88"/>

    <!-- Subtle MODIS unharmonized thermal divergence reference on left -->
    <path d="M 142 308 H 178 L 210 278 H 256" fill="none" stroke="#dc8f72" stroke-width="2.4" stroke-dasharray="3.5 4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- Subtle soft under-glow behind hero signal trace -->
    <path d="M 140 296 H 180 L 208 248 H 256" fill="none" stroke="#ecbe62" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
    <path d="M 256 248 H 304 L 332 198 H 374" fill="none" stroke="#58bdb8" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" opacity="0.20"/>

    <!-- Hero Harmonized Trace: MODIS amber step -> Seam Bridge -> VIIRS cyan continuation -->
    <path d="M 140 296 H 180 L 208 248 H 256" fill="none" stroke="url(#sd-modis)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 256 248 H 304 L 332 198 H 374" fill="none" stroke="url(#sd-viirs)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Thermal origin dot (left MODIS pulse) & target dot (right VIIRS sensor) -->
    <circle cx="140" cy="296" r="5" fill="#ecbe62"/>
    <circle cx="374" cy="198" r="5.5" fill="#9fe5e0"/>

    <!-- Center Calibration Bridge Node -->
    <circle cx="256" cy="248" r="18" fill="#58bdb8" opacity="0.24"/>
    <circle cx="256" cy="248" r="11.5" fill="#0d1a21" stroke="#faf9f6" stroke-width="3.6"/>
    <circle cx="256" cy="248" r="4.6" fill="#ecbe62"/>
  </g>

  <!-- Crisp inner rim highlight -->
  <circle cx="256" cy="256" r="139" fill="none" stroke="#d8ecea" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- Foreground orbital ellipse arc (passes in front of lower globe) & spacecraft -->
  <g transform="translate(256 256) rotate(-24)">
    <path d="M -202.0 0 A 202.0 60.0 0 0 0 202.0 0" fill="none" stroke="url(#sd-orbit-front)" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Secondary subtle orbital tracking dot -->
    <circle cx="-167.5" cy="33.6" r="4.5" fill="#58bdb8" stroke="#0e1721" stroke-width="2"/>

    <!-- Geometric Earth-observation spacecraft aligned cleanly to orbital tangent -->
    <g transform="translate(181.6 26.3) rotate(148.7)">
      <circle cx="0" cy="0" r="16" fill="#ecbe62" opacity="0.24"/>
      <!-- Solar wings -->
      <rect x="-15" y="-3.2" width="9" height="6.4" rx="1.2" fill="#58bdb8" stroke="#0e1721" stroke-width="1.3"/>
      <rect x="6" y="-3.2" width="9" height="6.4" rx="1.2" fill="#58bdb8" stroke="#0e1721" stroke-width="1.3"/>
      <!-- Satellite bus -->
      <rect x="-5" y="-5" width="10" height="10" rx="2.4" fill="#ecbe62" stroke="#0e1721" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2.2" fill="#faf9f6"/>
    </g>
  </g>
</svg>
